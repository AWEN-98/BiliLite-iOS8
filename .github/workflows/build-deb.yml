name: Build Bili Lite for iOS 8
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl make clang lld unzip zip xz-utils ca-certificates libarchive-tools dpkg-dev binutils python3
      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
      - name: Obtain iOS 10.3 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/bili-sdks
          git -C /tmp/bili-sdks sparse-checkout set iPhoneOS10.3.sdk
          cp -a /tmp/bili-sdks/iPhoneOS10.3.sdk "$HOME/theos/sdks/"
      - name: Generate icons
        run: python3 scripts/generate_icons.py
      - name: Compile and package
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip
      - name: Verify deb and build standard IPA
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Version)" = "0.1.6"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm"
          ar t "$DEB" | grep -Fx "data.tar.gz"
          mkdir -p /tmp/bililite-install
          dpkg-deb -x "$DEB" /tmp/bililite-install
          APP=/tmp/bililite-install/Applications/BiliLite.app
          test -x "$APP/BiliLite"
          test -s "$APP/Info.plist"
          test -s "$APP/Icon.png"
          test -s "$APP/Icon@2x.png"
          test -s "$APP/Default@2x.png"
          file "$APP/BiliLite"
          file "$APP/BiliLite" | grep -q "Mach-O armv7 executable"
          python3 - "$APP/Info.plist" <<'PYTEST'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f: p=plistlib.load(f)
          assert p["CFBundleIdentifier"] == "com.finn.bililite", p
          assert p["CFBundleExecutable"] == "BiliLite", p
          assert p["MinimumOSVersion"] == "8.0", p
          assert p["CFBundleShortVersionString"] == "0.1.6", p
          assert p["UIDeviceFamily"] == [1], p
          assert p["CFBundleSignature"] == "????", p
          assert p["CFBundleSupportedPlatforms"] == ["iPhoneOS"], p
          print("Bundle metadata verified for iOS 8")
          PYTEST
          mkdir -p /tmp/bililite-ipa/Payload
          cp -a "$APP" /tmp/bililite-ipa/Payload/BiliLite.app
          (cd /tmp/bililite-ipa && zip -qr -X "$GITHUB_WORKSPACE/packages/BiliLite-iOS8-v0.1.6.ipa" Payload)
          unzip -t packages/BiliLite-iOS8-v0.1.6.ipa | tail -1
          unzip -Z1 packages/BiliLite-iOS8-v0.1.6.ipa | grep -Fx "Payload/BiliLite.app/Info.plist"
          dpkg-deb -c "$DEB" | grep -F "Applications/BiliLite.app/Info.plist"
          dpkg-deb --ctrl-tarfile "$DEB" | tar -tvf -
          if dpkg-deb --ctrl-tarfile "$DEB" | tar -tf - | grep -E '(^|/)(postinst|preinst|postrm|prerm)
          echo "Both installable packaging formats verified."
          sha256sum packages/*.deb packages/*.ipa
      - name: Upload iOS 8 install files
        uses: actions/upload-artifact@v4
        with:
          name: BiliLite-iOS8-v0.1.6-DEB-IPA
          path: |
            packages/*.deb
            packages/*.ipa
          if-no-files-found: error
; then
            echo "ERROR: package contains unwanted install scripts"
            exit 1
          fi
          echo "Verified: no post-install or remove script"
          echo "Both installable packaging formats verified."
          sha256sum packages/*.deb packages/*.ipa
      - name: Upload iOS 8 install files
        uses: actions/upload-artifact@v4
        with:
          name: BiliLite-iOS8-v0.1.6-DEB-IPA
          path: |
            packages/*.deb
            packages/*.ipa
          if-no-files-found: error
