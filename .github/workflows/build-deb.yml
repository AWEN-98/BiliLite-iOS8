name: Build iOS 8 deb
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install requirements
        run: sudo apt-get update && sudo apt-get install -y git curl make clang lld unzip xz-utils ca-certificates libarchive-tools
      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
      - name: Install iOS 10.3 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/bili-sdks
          git -C /tmp/bili-sdks sparse-checkout set iPhoneOS10.3.sdk
          cp -a /tmp/bili-sdks/iPhoneOS10.3.sdk "$HOME/theos/sdks/"
      - name: Generate icons
        run: python3 scripts/generate_icons.py
      - name: Build
        run: |
          export THEOS="$HOME/theos"
          chmod +x layout/DEBIAN/postinst layout/DEBIAN/postrm
          make package FINALPACKAGE=1
      - name: Verify package layout
        run: |
          set -e
          DEB=$(find packages -name '*.deb' | head -1)
          dpkg-deb -c "$DEB" | tee /tmp/package-tree.txt
          grep -q 'Applications/BiliLite.app/BiliLite' /tmp/package-tree.txt
          grep -q 'Applications/BiliLite.app/Icon.png' /tmp/package-tree.txt
          dpkg-deb --ctrl-tarfile "$DEB" | tar -tvf -

      - uses: actions/upload-artifact@v4
        with:
          name: BiliLite-iOS8-deb
          path: packages/*.deb
          if-no-files-found: error
