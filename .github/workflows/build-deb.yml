name: Build Bili Lite iOS 8
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl make clang lld unzip zip xz-utils ca-certificates libarchive-tools dpkg-dev binutils python3
      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
      - name: Obtain iOS 10.3 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/bili-sdks
          git -C /tmp/bili-sdks sparse-checkout set iPhoneOS10.3.sdk
          cp -a /tmp/bili-sdks/iPhoneOS10.3.sdk "$HOME/theos/sdks/"
      - name: Generate icons
        run: python3 scripts/generate_icons.py
      - name: Compile and package
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip
      - name: Verify deb has no maintainer scripts and create IPA
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Version)" = "0.1.6"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm"
          ar t "$DEB" | grep -Fx "data.tar.gz"
          dpkg-deb --ctrl-tarfile "$DEB" | tar -tvf -
          dpkg-deb --ctrl-tarfile "$DEB" | tar -tf - > /tmp/control-files.txt
          if grep -E '(^|/)(postinst|preinst|postrm|prerm)$' /tmp/control-files.txt; then
            echo "ERROR unwanted maintainer script found"
            exit 1
          fi
          mkdir -p /tmp/bililite-install /tmp/bililite-ipa/Payload
          dpkg-deb -x "$DEB" /tmp/bililite-install
          APP=/tmp/bililite-install/Applications/BiliLite.app
          test -x "$APP/BiliLite"
          test -s "$APP/Info.plist"
          test -s "$APP/Icon.png"
          test -s "$APP/Default@2x.png"
          file "$APP/BiliLite" | grep -F "Mach-O armv7 executable"
          python3 - "$APP/Info.plist" <<'PYTEST'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              p=plistlib.load(f)
          assert p["CFBundleIdentifier"] == "com.finn.bililite"
          assert p["CFBundleExecutable"] == "BiliLite"
          assert p["MinimumOSVersion"] == "8.0"
          assert p["UIDeviceFamily"] == [1]
          assert p["CFBundleShortVersionString"] == "0.1.6"
          print("App plist verified")
          PYTEST
          cp -a "$APP" /tmp/bililite-ipa/Payload/BiliLite.app
          (cd /tmp/bililite-ipa && zip -qr -X "$GITHUB_WORKSPACE/packages/BiliLite-iOS8-v0.1.6.ipa" Payload)
          unzip -t packages/BiliLite-iOS8-v0.1.6.ipa | tail -1
          echo "Verified gzip deb and no custom install scripts"
          sha256sum packages/*.deb packages/*.ipa
      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: BiliLite-iOS8-v0.1.6-DEB-IPA
          path: |
            packages/*.deb
            packages/*.ipa
          if-no-files-found: error
