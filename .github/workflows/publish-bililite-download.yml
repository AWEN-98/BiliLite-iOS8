name: Publish BiliLite Direct Downloads
on:
  push:
    paths:
      - '.github/workflows/publish-bililite-download.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified armv7 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/verified
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow "Build Bili Lite iOS 8" --commit "$GITHUB_SHA" --json databaseId,status,conclusion --limit 10 | python3 -c 'import json,sys; runs=json.load(sys.stdin); print(next((str(r["databaseId"]) for r in runs if r["status"]=="completed" and r["conclusion"]=="success"), ""))')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list --workflow "Build Bili Lite iOS 8" --branch main --json databaseId,status,conclusion --limit 20 | python3 -c 'import json,sys; runs=json.load(sys.stdin); print(next((str(r["databaseId"]) for r in runs if r["status"]=="completed" and r["conclusion"]=="success"), ""))')"
          fi
          test -n "$RUN_ID"
          gh run download "$RUN_ID" -R AWEN-98/BiliLite-iOS8 -n 'BiliLite-iOS8-v0.8.0-DEB-IPA' -D /tmp/verified
          DEB="$(find /tmp/verified -maxdepth 2 -name '*.deb' -print -quit)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm"
          test "$(dpkg-deb -f "$DEB" Version)" = "0.8.0"
          ar t "$DEB" | grep -qx data.tar.gz
          mkdir -p downloads
          cp "$DEB" "downloads/BiliLite-iOS8-v0.8.0.deb"
          (cd downloads && zip -q -9 "BiliLite-iOS8-v0.8.0.zip" "BiliLite-iOS8-v0.8.0.deb")
          unzip -t "downloads/BiliLite-iOS8-v0.8.0.zip"
          sha256sum "downloads/BiliLite-iOS8-v0.8.0.deb" "downloads/BiliLite-iOS8-v0.8.0.zip"
      - name: Commit binary downloads for direct links
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/BiliLite-iOS8-v0.8.0.deb downloads/BiliLite-iOS8-v0.8.0.zip
          if ! git diff --cached --quiet; then
            git commit -m "release: publish verified BiliLite direct download files [skip ci]"
            git push origin HEAD:main
          fi
